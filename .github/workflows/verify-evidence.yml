name: Verify archived controller evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-verification:
    name: Evidence verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned verifier dependency
        run: python -m pip install cryptography==45.0.6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify every portable bundle, digest, identity and complete chain
        run: python tools/verify_evidence_repo.py .
      - name: Verify the local browser verifier against signed synthetic evidence
        run: python tools/test_browser_verifier.py
      - name: Verify the client-only processor-key generator
        run: node tools/test_processor_key_generator.js
      - name: Verify the client-only controller-key custody tool
        run: node tools/test_controller_key_custody.js
  ingestion-path-validation:
    name: Ingestion path validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned verifier dependency
        run: python -m pip install cryptography==45.0.6
      - name: Detect evidence-ingestion changes
        id: ingestion
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^instances/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require exactly one new bundle and digest directory
        if: steps.ingestion.outputs.changed == 'true'
        run: >-
          python tools/validate_ingestion_paths.py .
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Confirm reviewed maintenance change
        if: steps.ingestion.outputs.changed != 'true'
        run: echo "No instance evidence path changed; Code Owner review governs this maintenance pull request."
